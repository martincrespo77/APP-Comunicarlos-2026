<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UML Interactivo - Mesa de Ayuda Comunicarlos</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0e17;color:#e0e6ed;font-family:'Segoe UI',system-ui,sans-serif;overflow:hidden;height:100vh;width:100vw}
#topbar{position:fixed;top:0;left:0;right:0;height:48px;background:#111827;border-bottom:1px solid #1e293b;display:flex;align-items:center;padding:0 16px;gap:12px;z-index:1000}
#topbar h1{font-size:15px;color:#38bdf8;white-space:nowrap}
#topbar input{flex:0 1 280px;padding:6px 12px;background:#1e293b;border:1px solid #334155;border-radius:6px;color:#e0e6ed;font-size:13px}
.filter-btn{padding:4px 10px;border-radius:4px;border:1px solid #334155;background:#1e293b;color:#94a3b8;font-size:11px;cursor:pointer;white-space:nowrap;transition:all .15s}
.filter-btn:hover{border-color:#64748b}
.filter-btn.active{background:#1e3a5f;border-color:#38bdf8;color:#38bdf8}
#resetBtn{padding:4px 10px;border-radius:4px;border:1px solid #f87171;background:transparent;color:#f87171;font-size:11px;cursor:pointer}
#resetBtn:hover{background:#f8717122}
#canvas{position:absolute;top:48px;left:0;right:0;bottom:0;overflow:auto;cursor:grab}
#canvas.grabbing{cursor:grabbing}
#world{position:relative;width:6000px;height:4500px}
#connections{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1}
.uml-node{position:absolute;background:#111827;border:2px solid #1e3a5f;border-radius:8px;min-width:240px;max-width:340px;z-index:10;cursor:move;box-shadow:0 4px 20px rgba(0,0,0,.5);transition:box-shadow .2s,opacity .15s}
.uml-node:hover{box-shadow:0 4px 30px rgba(56,189,248,.25);z-index:20}
.uml-node.highlight{border-color:#f59e0b!important;box-shadow:0 0 20px rgba(245,158,11,.4)}
.uml-node.dimmed{opacity:.15}
.node-header{padding:8px 12px;border-bottom:1px solid #1e3a5f;display:flex;flex-direction:column;gap:2px}
.node-stereotype{font-size:10px;color:#38bdf8;text-align:center;font-style:italic}
.node-title{font-size:14px;font-weight:700;text-align:center}
.node-section{padding:6px 12px;border-bottom:1px solid rgba(30,58,95,.3)}
.node-section:last-of-type{border-bottom:none}
.section-label{font-size:9px;color:#64748b;text-transform:uppercase;letter-spacing:1px;margin-bottom:3px}
.attr-line,.method-line{font-size:11px;font-family:'Cascadia Code','Fira Code',monospace;line-height:1.6;color:#cbd5e1}
.attr-line::before{content:'+';color:#38bdf8;margin-right:4px}
.method-line::before{content:'+';color:#a78bfa;margin-right:4px}
.method-line.abstract::before{content:'*';color:#f59e0b}
.method-line.private::before{content:'-';color:#f87171}
.method-line.property::before{content:'@';color:#34d399}
.layer-entity .node-header{background:#1a1a2e;border-color:#4f46e5}
.layer-entity{border-color:#4f46e5}
.layer-vo .node-header{background:#1a2e1a;border-color:#22c55e}
.layer-vo{border-color:#22c55e}
.layer-enum .node-header{background:#2e2e1a;border-color:#eab308}
.layer-enum{border-color:#eab308}
.layer-factory .node-header{background:#2e261a;border-color:#d97706}
.layer-factory{border-color:#d97706}
.layer-exception .node-header{background:#2e1a1a;border-color:#f87171}
.layer-exception{border-color:#f87171}
.layer-service .node-header{background:#1a2e2e;border-color:#06b6d4}
.layer-service{border-color:#06b6d4}
.layer-repo .node-header{background:#1e293b;border-color:#f97316}
.layer-repo{border-color:#f97316}
.layer-schema .node-header{background:#1a1e2e;border-color:#818cf8}
.layer-schema{border-color:#818cf8}
.layer-router .node-header{background:#1a2e28;border-color:#14b8a6}
.layer-router{border-color:#14b8a6}
.layer-observer .node-header{background:#2e1a2e;border-color:#a855f7}
.layer-observer{border-color:#a855f7}
.layer-auth .node-header{background:#2e261a;border-color:#ca8a04}
.layer-auth{border-color:#ca8a04}
.layer-shared .node-header{background:#1a2428;border-color:#2dd4bf}
.layer-shared{border-color:#2dd4bf}
#modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:2000;justify-content:center;align-items:center}
#modal-overlay.show{display:flex}
#modal{background:#1e293b;border:1px solid #334155;border-radius:12px;width:90%;max-width:800px;max-height:85vh;display:flex;flex-direction:column}
#modal-header{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;border-bottom:1px solid #334155}
#modal-header h2{font-size:16px;color:#38bdf8}
.close-btn{padding:5px 14px;border-radius:6px;border:1px solid #f87171;background:transparent;color:#f87171;font-size:12px;cursor:pointer}
.close-btn:hover{background:#f8717122}
#modal-body{overflow-y:auto;flex:1;padding:16px 20px}
.detail-section{margin-bottom:18px;padding:14px 18px;border-radius:10px;border:1px solid #334155}
.detail-section.file{background:#1a1a2e;border-color:#4f46e5}
.detail-section.desc{background:#1a2e2e;border-color:#06b6d4}
.detail-section.pattern{background:#1a2e1a;border-color:#22c55e}
.detail-label{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.detail-label.file-label{color:#818cf8}
.detail-label.desc-label{color:#22d3ee}
.detail-label.pattern-label{color:#4ade80}
.detail-text{font-size:13px;line-height:1.8;color:#cbd5e1}
.detail-text code{background:#0f172a;padding:2px 6px;border-radius:4px;font-family:'Cascadia Code','Fira Code',monospace;font-size:12px}
#legend{position:fixed;bottom:12px;left:12px;background:#111827;border:1px solid #1e293b;border-radius:8px;padding:10px 14px;z-index:900;font-size:11px;user-select:none;max-height:calc(100vh - 80px);overflow-y:auto}
#legend h3{font-size:12px;color:#38bdf8;margin-bottom:6px}
.legend-item{display:flex;align-items:center;gap:6px;margin-bottom:3px;cursor:pointer;padding:2px 4px;border-radius:4px;transition:background .15s}
.legend-item:hover{background:rgba(255,255,255,.06)}
.legend-item.off{opacity:.35}
.legend-color{width:14px;height:14px;border-radius:3px;border:2px solid}
.legend-check{width:10px;height:10px;border-radius:2px;border:1.5px solid #38bdf8;background:#38bdf8;transition:background .15s;flex-shrink:0}
.legend-item.off .legend-check{background:transparent}
.conn-inherit{stroke:#38bdf8;stroke-width:2}
.conn-compose{stroke:#22c55e;stroke-width:1.5;stroke-dasharray:6,3}
.conn-use{stroke:#94a3b8;stroke-width:1;stroke-dasharray:4,4}
.conn-implement{stroke:#a855f7;stroke-width:2;stroke-dasharray:8,4}
.node-tooltip{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:#0f172a;border:1px solid #334155;border-radius:6px;padding:6px 10px;font-size:11px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .15s;z-index:30;color:#94a3b8}
.uml-node:hover .node-tooltip{opacity:1}
#minimap{position:fixed;bottom:12px;right:12px;width:200px;height:150px;background:#111827;border:1px solid #1e293b;border-radius:8px;z-index:900;overflow:hidden}
#minimap-viewport{position:absolute;border:1px solid #38bdf8;background:rgba(56,189,248,.1);cursor:move;pointer-events:auto}
</style>
</head>
<body>
<div id="topbar">
  <h1>UML Interactivo &mdash; Mesa de Ayuda Comunicarlos</h1>
  <input type="text" id="searchInput" placeholder="Buscar clase...">
  <button class="filter-btn active" data-layer="all">Todas</button>
  <button class="filter-btn" data-layer="entity">Entidades</button>
  <button class="filter-btn" data-layer="enum">Enums</button>
  <button class="filter-btn" data-layer="vo">Value Objects</button>
  <button class="filter-btn" data-layer="observer">Observer</button>
  <button class="filter-btn" data-layer="factory">Factory</button>
  <button class="filter-btn" data-layer="exception">Excepciones</button>
  <button class="filter-btn" data-layer="service">Services</button>
  <button class="filter-btn" data-layer="repo">Repos</button>
  <button class="filter-btn" data-layer="schema">Schemas</button>
  <button class="filter-btn" data-layer="router">Routers</button>
  <button class="filter-btn" data-layer="auth">Auth</button>
  <button class="filter-btn" data-layer="shared">Shared</button>
  <button id="resetBtn">Reset</button>
</div>
<div id="canvas">
  <div id="world">
    <svg id="connections">
      <defs>
        <marker id="arrow-inherit" markerWidth="12" markerHeight="8" refX="12" refY="4" orient="auto"><polygon points="0,0 12,4 0,8" fill="none" stroke="#38bdf8" stroke-width="1.5"/></marker>
        <marker id="arrow-use" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0,0 8,3 0,6" fill="#94a3b8"/></marker>
        <marker id="diamond-compose" markerWidth="10" markerHeight="8" refX="0" refY="4" orient="auto"><polygon points="5,0 10,4 5,8 0,4" fill="#22c55e"/></marker>
        <marker id="arrow-implement" markerWidth="12" markerHeight="8" refX="12" refY="4" orient="auto"><polygon points="0,0 12,4 0,8" fill="none" stroke="#a855f7" stroke-width="1.5"/></marker>
      </defs>
    </svg>
  </div>
</div>
<div id="modal-overlay" onclick="if(event.target===this)closeModal()">
  <div id="modal">
    <div id="modal-header"><h2 id="modal-title"></h2><button class="close-btn" onclick="closeModal()">Cerrar</button></div>
    <div id="modal-body"></div>
  </div>
</div>
<div id="legend">
  <h3>Leyenda <span style="font-size:10px;color:#64748b;font-weight:400">(click para filtrar)</span></h3>
  <div class="legend-item" data-toggle="entity"><span class="legend-check"></span><div class="legend-color" style="border-color:#4f46e5;background:#1a1a2e"></div> Entidades</div>
  <div class="legend-item" data-toggle="enum"><span class="legend-check"></span><div class="legend-color" style="border-color:#eab308;background:#2e2e1a"></div> Enums</div>
  <div class="legend-item" data-toggle="vo"><span class="legend-check"></span><div class="legend-color" style="border-color:#22c55e;background:#1a2e1a"></div> Value Objects</div>
  <div class="legend-item" data-toggle="observer"><span class="legend-check"></span><div class="legend-color" style="border-color:#a855f7;background:#2e1a2e"></div> Observer Pattern</div>
  <div class="legend-item" data-toggle="factory"><span class="legend-check"></span><div class="legend-color" style="border-color:#d97706;background:#2e261a"></div> Factory</div>
  <div class="legend-item" data-toggle="exception"><span class="legend-check"></span><div class="legend-color" style="border-color:#f87171;background:#2e1a1a"></div> Excepciones</div>
  <div class="legend-item" data-toggle="service"><span class="legend-check"></span><div class="legend-color" style="border-color:#06b6d4;background:#1a2e2e"></div> Services</div>
  <div class="legend-item" data-toggle="repo"><span class="legend-check"></span><div class="legend-color" style="border-color:#f97316;background:#1e293b"></div> Repos</div>
  <div class="legend-item" data-toggle="schema"><span class="legend-check"></span><div class="legend-color" style="border-color:#818cf8;background:#1a1e2e"></div> Schemas</div>
  <div class="legend-item" data-toggle="router"><span class="legend-check"></span><div class="legend-color" style="border-color:#14b8a6;background:#1a2e28"></div> Routers</div>
  <div class="legend-item" data-toggle="auth"><span class="legend-check"></span><div class="legend-color" style="border-color:#ca8a04;background:#2e261a"></div> Auth / JWT</div>
  <div class="legend-item" data-toggle="shared"><span class="legend-check"></span><div class="legend-color" style="border-color:#2dd4bf;background:#1a2428"></div> Shared Kernel</div>
  <div style="margin-top:6px;border-top:1px solid #334155;padding-top:6px">
    <div class="legend-item" style="cursor:default"><svg width="30" height="10"><line x1="0" y1="5" x2="30" y2="5" stroke="#38bdf8" stroke-width="2"/></svg> Herencia</div>
    <div class="legend-item" style="cursor:default"><svg width="30" height="10"><line x1="0" y1="5" x2="30" y2="5" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="6,3"/></svg> Composici&oacute;n</div>
    <div class="legend-item" style="cursor:default"><svg width="30" height="10"><line x1="0" y1="5" x2="30" y2="5" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4"/></svg> Uso / Dependencia</div>
    <div class="legend-item" style="cursor:default"><svg width="30" height="10"><line x1="0" y1="5" x2="30" y2="5" stroke="#a855f7" stroke-width="2" stroke-dasharray="8,4"/></svg> Implementa</div>
  </div>
</div>
<div id="minimap"><div id="minimap-viewport"></div></div>

const world=document.getElementById('world');
const svgEl=document.getElementById('connections');
const canvas=document.getElementById('canvas');
const nodeElements={};
let activeFilter='all';
const layerVisibility={};

classData.forEach(cls=>{
  layerVisibility[cls.layer]=true;
  const node=document.createElement('div');
  node.className='uml-node layer-'+cls.layer;
  node.id='node-'+cls.id;
  node.style.left=cls.x+'px';
  node.style.top=cls.y+'px';
  node.dataset.layer=cls.layer;
  node.dataset.classId=cls.id;
  let html='<div class="node-tooltip">'+cls.file+'</div>';
  html+='<div class="node-header">';
  if(cls.stereotype) html+='<div class="node-stereotype">'+cls.stereotype+'</div>';
  html+='<div class="node-title">'+cls.id+'</div></div>';
  if(cls.attrs.length){
    html+='<div class="node-section"><div class="section-label">Atributos</div>';
    cls.attrs.forEach(function(a){html+='<div class="attr-line">'+a+'</div>';});
    html+='</div>';
  }
  if(cls.methods.length){
    html+='<div class="node-section"><div class="section-label">M\u00e9todos</div>';
    cls.methods.forEach(function(m){
      var mod=m.mod||'';
      html+='<div class="method-line '+mod+'">'+m.name+'</div>';
    });
    html+='</div>';
  }
  node.innerHTML=html;
  world.appendChild(node);
  nodeElements[cls.id]=node;
  node.addEventListener('dblclick',function(e){e.stopPropagation();openClassModal(cls);});
});

var dragNode=null,dragOffsetX=0,dragOffsetY=0;
world.addEventListener('mousedown',function(e){
  var node=e.target.closest('.uml-node');
  if(!node)return;
  dragNode=node;
  var rect=node.getBoundingClientRect();
  dragOffsetX=e.clientX-rect.left;
  dragOffsetY=e.clientY-rect.top;
  node.style.zIndex=50;
  e.preventDefault();
});
document.addEventListener('mousemove',function(e){
  if(!dragNode)return;
  var worldRect=world.getBoundingClientRect();
  var x=e.clientX-worldRect.left-dragOffsetX+canvas.scrollLeft;
  var y=e.clientY-worldRect.top-dragOffsetY+canvas.scrollTop;
  x=Math.max(0,x);y=Math.max(0,y);
  dragNode.style.left=x+'px';
  dragNode.style.top=y+'px';
  var cls=classData.find(function(c){return c.id===dragNode.dataset.classId;});
  if(cls){cls.x=x;cls.y=y;}
  drawConnections();updateMinimap();
});
document.addEventListener('mouseup',function(){
  if(dragNode){dragNode.style.zIndex=10;dragNode=null;}
});

function getNodeCenter(id){
  var el=nodeElements[id];
  if(!el||el.style.display==='none')return null;
  var x=parseInt(el.style.left)+el.offsetWidth/2;
  var y=parseInt(el.style.top)+el.offsetHeight/2;
  return{x:x,y:y};
}
function getNodeEdge(fromCenter,toCenter,nodeId){
  var el=nodeElements[nodeId];
  if(!el)return fromCenter;
  var w=el.offsetWidth/2;
  var h=el.offsetHeight/2;
  var cx=parseInt(el.style.left)+w;
  var cy=parseInt(el.style.top)+h;
  var dx=toCenter.x-fromCenter.x;
  var dy=toCenter.y-fromCenter.y;
  var angle=Math.atan2(dy,dx);
  var absCos=Math.abs(Math.cos(angle));
  var absSin=Math.abs(Math.sin(angle));
  var dist;
  if(absCos*h>absSin*w){dist=w/absCos;}else{dist=h/absSin;}
  return{x:cx+Math.cos(angle)*dist,y:cy+Math.sin(angle)*dist};
}
function drawConnections(){
  while(svgEl.children.length>1)svgEl.removeChild(svgEl.lastChild);
  connections.forEach(function(conn){
    var from=getNodeCenter(conn.from);
    var to=getNodeCenter(conn.to);
    if(!from||!to)return;
    var fromEdge=getNodeEdge(from,to,conn.from);
    var toEdge=getNodeEdge(to,from,conn.to);
    var line=document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1',fromEdge.x);line.setAttribute('y1',fromEdge.y);
    line.setAttribute('x2',toEdge.x);line.setAttribute('y2',toEdge.y);
    line.classList.add('conn-'+conn.type);
    if(conn.type==='inherit')line.setAttribute('marker-end','url(#arrow-inherit)');
    else if(conn.type==='use')line.setAttribute('marker-end','url(#arrow-use)');
    else if(conn.type==='compose')line.setAttribute('marker-start','url(#diamond-compose)');
    else if(conn.type==='implement')line.setAttribute('marker-end','url(#arrow-implement)');
    svgEl.appendChild(line);
  });
}

document.querySelectorAll('.filter-btn').forEach(function(btn){
  btn.addEventListener('click',function(){
    document.querySelectorAll('.filter-btn').forEach(function(b){b.classList.remove('active');});
    btn.classList.add('active');
    activeFilter=btn.dataset.layer;
    applyFilter();
  });
});
document.getElementById('resetBtn').addEventListener('click',function(){
  activeFilter='all';
  Object.keys(layerVisibility).forEach(function(k){layerVisibility[k]=true;});
  document.querySelectorAll('.filter-btn').forEach(function(b){b.classList.remove('active');});
  document.querySelector('[data-layer="all"]').classList.add('active');
  document.querySelectorAll('.legend-item[data-toggle]').forEach(function(li){li.classList.remove('off');});
  applyFilter();
});
function applyFilter(){
  classData.forEach(function(cls){
    var el=nodeElements[cls.id];
    var layerOn=layerVisibility[cls.layer]!==false;
    var filterOn=activeFilter==='all'||cls.layer===activeFilter;
    if(layerOn&&filterOn){el.style.display='';el.classList.remove('dimmed');}
    else if(layerOn&&activeFilter!=='all'){el.style.display='';el.classList.add('dimmed');}
    else{el.style.display='none';el.classList.remove('dimmed');}
  });
  drawConnections();updateMinimap();
}

document.getElementById('searchInput').addEventListener('input',function(){
  var q=this.value.toLowerCase().trim();
  document.querySelectorAll('.uml-node').forEach(function(n){n.classList.remove('highlight');});
  if(!q)return;
  classData.forEach(function(cls){
    if(cls.id.toLowerCase().indexOf(q)!==-1||(cls.file&&cls.file.toLowerCase().indexOf(q)!==-1)){
      var el=nodeElements[cls.id];
      el.classList.add('highlight');
      if(q.length>2){
        var x=parseInt(el.style.left)-canvas.clientWidth/2+el.offsetWidth/2;
        var y=parseInt(el.style.top)-canvas.clientHeight/2+el.offsetHeight/2;
        canvas.scrollTo({left:Math.max(0,x),top:Math.max(0,y),behavior:'smooth'});
      }
    }
  });
});

document.querySelectorAll('.legend-item[data-toggle]').forEach(function(li){
  li.addEventListener('click',function(){
    var layer=li.dataset.toggle;
    li.classList.toggle('off');
    layerVisibility[layer]=!li.classList.contains('off');
    applyFilter();
  });
});

function openClassModal(cls){
  document.getElementById('modal-title').textContent=cls.id;
  var html='';
  html+='<div class="detail-section file"><div class="detail-label file-label">Archivo</div><div class="detail-text"><code>'+cls.file+'</code></div></div>';
  html+='<div class="detail-section desc"><div class="detail-label desc-label">Descripci\u00f3n</div><div class="detail-text">'+cls.desc+'</div></div>';
  if(cls.pattern){html+='<div class="detail-section pattern"><div class="detail-label pattern-label">Patr\u00f3n / Decisi\u00f3n de Dise\u00f1o</div><div class="detail-text">'+cls.pattern+'</div></div>';}
  if(cls.attrs.length){html+='<div class="detail-section" style="background:#111827;border-color:#334155"><div class="detail-label" style="color:#38bdf8">Atributos ('+cls.attrs.length+')</div><div class="detail-text">'+cls.attrs.map(function(a){return '<code>'+a+'</code>';}).join('<br>')+'</div></div>';}
  if(cls.methods.length){html+='<div class="detail-section" style="background:#111827;border-color:#334155"><div class="detail-label" style="color:#a78bfa">M\u00e9todos ('+cls.methods.length+')</div><div class="detail-text">'+cls.methods.map(function(m){return '<code>'+m.name+'</code>';}).join('<br>')+'</div></div>';}
  document.getElementById('modal-body').innerHTML=html;
  document.getElementById('modal-overlay').classList.add('show');
}
function closeModal(){document.getElementById('modal-overlay').classList.remove('show');}

var minimapEl=document.getElementById('minimap');
var minimapVP=document.getElementById('minimap-viewport');
var WORLD_W=6000,WORLD_H=4500;
var MM_W=200,MM_H=150;
function updateMinimap(){
  var existingCanvas=minimapEl.querySelector('canvas');
  if(existingCanvas)existingCanvas.remove();
  var c=document.createElement('canvas');
  c.width=MM_W;c.height=MM_H;
  c.style.cssText='position:absolute;top:0;left:0;width:100%;height:100%';
  minimapEl.insertBefore(c,minimapVP);
  var ctx=c.getContext('2d');
  ctx.clearRect(0,0,MM_W,MM_H);
  var colors={entity:'#4f46e5',vo:'#22c55e','enum':'#eab308',factory:'#d97706',exception:'#f87171',service:'#06b6d4',repo:'#f97316',schema:'#818cf8',router:'#14b8a6',observer:'#a855f7',auth:'#ca8a04',shared:'#2dd4bf'};
  classData.forEach(function(cls){
    var el=nodeElements[cls.id];
    if(el.style.display==='none')return;
    var x=cls.x/WORLD_W*MM_W;
    var y=cls.y/WORLD_H*MM_H;
    ctx.fillStyle=colors[cls.layer]||'#64748b';
    ctx.fillRect(x-2,y-2,5,4);
  });
  var vpW=canvas.clientWidth/WORLD_W*MM_W;
  var vpH=canvas.clientHeight/WORLD_H*MM_H;
  var vpX=canvas.scrollLeft/WORLD_W*MM_W;
  var vpY=canvas.scrollTop/WORLD_H*MM_H;
  minimapVP.style.width=vpW+'px';
  minimapVP.style.height=vpH+'px';
  minimapVP.style.left=vpX+'px';
  minimapVP.style.top=vpY+'px';
}
canvas.addEventListener('scroll',updateMinimap);
var mmDrag=false;
minimapEl.addEventListener('mousedown',function(e){mmDrag=true;mmNavigate(e);});
document.addEventListener('mousemove',function(e){if(mmDrag)mmNavigate(e);});
document.addEventListener('mouseup',function(){mmDrag=false;});
function mmNavigate(e){
  var rect=minimapEl.getBoundingClientRect();
  var x=(e.clientX-rect.left)/MM_W*WORLD_W-canvas.clientWidth/2;
  var y=(e.clientY-rect.top)/MM_H*WORLD_H-canvas.clientHeight/2;
  canvas.scrollTo({left:Math.max(0,x),top:Math.max(0,y)});
}

var panning=false,panStartX=0,panStartY=0;
canvas.addEventListener('mousedown',function(e){
  if(e.target.closest('.uml-node'))return;
  panning=true;
  panStartX=e.clientX+canvas.scrollLeft;
  panStartY=e.clientY+canvas.scrollTop;
  canvas.classList.add('grabbing');
});
document.addEventListener('mousemove',function(e){
  if(!panning)return;
  canvas.scrollLeft=panStartX-e.clientX;
  canvas.scrollTop=panStartY-e.clientY;
});
document.addEventListener('mouseup',function(){panning=false;canvas.classList.remove('grabbing');});

drawConnections();updateMinimap();
</script>
</body>
</html>
